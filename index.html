<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKL-Блокнот · Пробив</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="notes.png" type="image/png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── ТЕМЫ ──────────────────────────────────────── */
:root {
  --bg: #0d0f14; --bg2: #13161e; --bg3: #1a1e28;
  --border: #2a2f3d; --border2: #3a4055;
  --text: #e8eaf0; --text2: #8890a8; --text3: #555d78;
  --accent: #4fffb0; --accent-dim: rgba(79,255,176,0.12); --accent2: #00c97a;
  --shadow: rgba(0,0,0,0.4);
}
body.theme-light {
  --bg: #f0f2f5; --bg2: #ffffff; --bg3: #e4e7ed;
  --border: #d1d5de; --border2: #b0b6c8;
  --text: #1a1e2e; --text2: #555d78; --text3: #8890a8;
  --accent: #008f57; --accent-dim: rgba(0,143,87,0.1); --accent2: #006640;
  --shadow: rgba(0,0,0,0.12);
}
body.theme-neutral {
  --bg: #1c1c1c; --bg2: #242424; --bg3: #2e2e2e;
  --border: #3a3a3a; --border2: #505050;
  --text: #e0e0e0; --text2: #a0a0a0; --text3: #666666;
  --accent: #c8a86a; --accent-dim: rgba(200,168,106,0.12); --accent2: #a88848;
  --shadow: rgba(0,0,0,0.5);
}
body.theme-purple {
  --bg: #0e0b1a; --bg2: #140f24; --bg3: #1c1530;
  --border: #2e2050; --border2: #4a3880;
  --text: #ece8ff; --text2: #9088c0; --text3: #5548a0;
  --accent: #c87cff; --accent-dim: rgba(200,124,255,0.12); --accent2: #a050e0;
  --shadow: rgba(0,0,0,0.5);
}
body.theme-ocean {
  --bg: #060f1e; --bg2: #0a1628; --bg3: #0f1f38;
  --border: #1a3050; --border2: #2a4870;
  --text: #d8eeff; --text2: #6898c8; --text3: #385878;
  --accent: #38d4ff; --accent-dim: rgba(56,212,255,0.12); --accent2: #00a8e0;
  --shadow: rgba(0,0,0,0.6);
}
body.theme-red {
  --bg: #120608; --bg2: #1c0a0d; --bg3: #280f12;
  --border: #3d1418; --border2: #6b2028;
  --text: #ffe8ea; --text2: #c06878; --text3: #7a3040;
  --accent: #ff4466; --accent-dim: rgba(255,68,102,0.13); --accent2: #cc2244;
  --shadow: rgba(0,0,0,0.6);
}
body.theme-amber {
  --bg: #100e04; --bg2: #181408; --bg3: #221c0c;
  --border: #3a2e10; --border2: #604e20;
  --text: #fff5d8; --text2: #c8a850; --text3: #7a6228;
  --accent: #ffcc00; --accent-dim: rgba(255,204,0,0.13); --accent2: #cc9900;
  --shadow: rgba(0,0,0,0.6);
}
body.theme-rose {
  --bg: #120810; --bg2: #1a0e18; --bg3: #241420;
  --border: #3d1838; --border2: #6b2860;
  --text: #ffe8f8; --text2: #c068b0; --text3: #7a3068;
  --accent: #ff66cc; --accent-dim: rgba(255,102,204,0.13); --accent2: #dd44aa;
  --shadow: rgba(0,0,0,0.6);
}
body.theme-matrix {
  --bg: #000800; --bg2: #001200; --bg3: #001a00;
  --border: #003300; --border2: #005500;
  --text: #ccffcc; --text2: #44cc44; --text3: #226622;
  --accent: #00ff41; --accent-dim: rgba(0,255,65,0.12); --accent2: #00cc33;
  --shadow: rgba(0,0,0,0.8);
}
body.theme-slate {
  --bg: #0c0e12; --bg2: #141820; --bg3: #1c2030;
  --border: #2c3448; --border2: #3c4a60;
  --text: #dce4f0; --text2: #7888a8; --text3: #445568;
  --accent: #7aadff; --accent-dim: rgba(122,173,255,0.12); --accent2: #4488dd;
  --shadow: rgba(0,0,0,0.5);
}
body.theme-copper {
  --bg: #0e0a06; --bg2: #181008; --bg3: #22180c;
  --border: #3c2810; --border2: #6a4020;
  --text: #ffe8cc; --text2: #cc8844; --text3: #7a4820;
  --accent: #ff9944; --accent-dim: rgba(255,153,68,0.13); --accent2: #dd7722;
  --shadow: rgba(0,0,0,0.6);
}


body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

/* ─── TIMER BAR ─────────────────────────────────── */
#timerBar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 6px 16px; display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; flex-shrink: 0; position: sticky; top: 0; z-index: 100;
}
#timerDisplay {
  font-family: 'Unbounded', sans-serif; font-size: 1.4rem; font-weight: 700;
  color: var(--accent); letter-spacing: 0.06em; min-width: 110px; text-align: center;
  text-shadow: 0 0 18px var(--accent); transition: color 0.3s;
}
#timerDisplay.danger { color: #ff4444; text-shadow: 0 0 18px #ff444488; animation: blink 0.6s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
.timer-btn { background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); border-radius: 8px; padding: 4px 11px; font-family: monospace; font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: 0.15s; }
.timer-btn:hover, .timer-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.timer-sep { color: var(--text3); font-size: 0.7rem; }
#timerInputWrap { display: flex; align-items: center; gap: 6px; }
#timerMinInput, #timerSecInput {
  width: 46px; background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); border-radius: 6px; padding: 4px 6px; font-family: monospace;
  font-size: 0.8rem; text-align: center; outline: none;
}
#timerMinInput:focus, #timerSecInput:focus { border-color: var(--accent); }
.timer-progress-wrap { flex: 1; min-width: 100px; height: 4px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
#timerProgress { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.9s linear, background 0.3s; }
.theme-switcher { margin-left: auto; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.theme-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.15s; }
.theme-dot:hover, .theme-dot.active { border-color: var(--accent); transform: scale(1.15); }
.theme-dot[data-theme="dark"]    { background: #13161e; outline: 1px solid #3a4055; }
.theme-dot[data-theme="light"]   { background: #f0f2f5; outline: 1px solid #d1d5de; }
.theme-dot[data-theme="neutral"] { background: #242424; outline: 1px solid #505050; }
.theme-dot[data-theme="purple"]  { background: linear-gradient(135deg,#140f24,#c87cff); }
.theme-dot[data-theme="ocean"]   { background: linear-gradient(135deg,#060f1e,#38d4ff); }
.theme-dot[data-theme="red"]     { background: linear-gradient(135deg,#1c0a0d,#ff4466); }
.theme-dot[data-theme="amber"]   { background: linear-gradient(135deg,#181408,#ffcc00); }
.theme-dot[data-theme="rose"]    { background: linear-gradient(135deg,#1a0e18,#ff66cc); }
.theme-dot[data-theme="matrix"]  { background: linear-gradient(135deg,#001200,#00ff41); }
.theme-dot[data-theme="slate"]   { background: linear-gradient(135deg,#141820,#7aadff); }
.theme-dot[data-theme="copper"]  { background: linear-gradient(135deg,#181008,#ff9944); }

/* ─── HEADER ────────────────────────────────────── */
header { padding: 0.85rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; background: var(--bg2); flex-wrap: wrap; flex-shrink: 0; }
.logo { font-family: 'Unbounded', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--accent); }
.badge { background: var(--accent-dim); color: var(--accent); font-size: 0.62rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--accent2); }

/* ─── TOOLBAR (formatting) ──────────────────────── */
#formatBar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 5px 12px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; flex-shrink: 0;
}
.fmt-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text2);
  border-radius: 6px; padding: 3px 10px; font-family: monospace; font-size: 0.78rem;
  cursor: pointer; transition: 0.12s; min-width: 32px; text-align: center;
}
.fmt-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
.fmt-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.fmt-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.fmt-color-wrap { display: flex; align-items: center; gap: 4px; font-size: 0.68rem; color: var(--text3); }
.fmt-color-wrap input[type=color] { width: 28px; height: 24px; border: 1px solid var(--border2); border-radius: 4px; cursor: pointer; background: none; padding: 1px; }

/* ─── TABS ──────────────────────────────────────── */
.tabs-outer { background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: stretch; min-height: 42px; flex-shrink: 0; }
.tabs-scroll { display: flex; align-items: stretch; overflow-x: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; padding: 0 6px; gap: 0; }
.tabs-scroll::-webkit-scrollbar { height: 4px; }
.tabs-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
.tab { display: flex; align-items: center; gap: 6px; padding: 4px 13px; border-right: 1px solid var(--border); cursor: pointer; font-size: 0.73rem; color: var(--text2); white-space: nowrap; min-height: 42px; transition: all 0.15s; position: relative; flex-shrink: 0; }
.tab:hover { background: var(--bg3); color: var(--text); }
.tab.active { background: var(--bg); color: var(--accent); border-bottom: 2px solid var(--accent); }
.tab-label { outline: none; background: transparent; border: none; color: inherit; font-family: monospace; font-size: 0.73rem; cursor: pointer; max-width: 120px; pointer-events: none; }
.tab.active .tab-label { pointer-events: auto; cursor: text; color: var(--accent); }
.tab-close { opacity: 0.4; font-size: 0.85rem; cursor: pointer; padding: 0 2px; border: none; background: transparent; color: inherit; line-height: 1; transition: 0.12s; }
.tab-close:hover { opacity: 1; color: #ff6b6b; }
.tab-count { background: var(--accent-dim); color: var(--accent); font-size: 0.58rem; padding: 1px 6px; border-radius: 999px; font-weight: 700; }
.tab-add-btn { flex-shrink: 0; align-self: center; margin: 0 8px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 0.75rem; white-space: nowrap; transition: 0.12s; }
.tab-add-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

/* ─── LAYOUT ────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: var(--split, 50%) 1fr;
  height: 800px;
  flex-shrink: 0;
  position: relative;
}
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; height: auto; } }

.resizer {
  position: absolute; top: 0; bottom: 0;
  left: var(--split, 50%);
  width: 6px; margin-left: -3px;
  cursor: col-resize; z-index: 10;
  background: transparent;
  transition: background 0.15s;
}
.resizer:hover, .resizer.dragging { background: var(--accent); opacity: 0.5; }
.resizer::after {
  content: '⠿';
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%) rotate(90deg);
  font-size: 1rem; color: var(--accent); opacity: 0;
  transition: opacity 0.15s; pointer-events: none;
}
.resizer:hover::after, .resizer.dragging::after { opacity: 1; }

.panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  height: 800px;
  overflow: hidden;
}
.panel:last-child { border-right: none; }
.panel-header { padding: 0.7rem 1.2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.6rem; background: var(--bg2); flex-shrink: 0; flex-wrap: wrap; }
.panel-title { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text2); }

/* ─── EDITOR ────────────────────────────────────── */
.contenteditable {
  flex: 1;
  background: var(--bg);
  color: var(--text);
  border: none;
  outline: none;
  padding: 1.1rem 1.4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.87rem;
  line-height: 1.8;
  overflow-y: auto;
  word-break: break-word;
  /* Растягивается внутри панели */
  min-height: 0;
}
.contenteditable:empty::before { content: attr(placeholder); color: var(--text3); pointer-events: none; }
/* Phone spans */
.phone-highlight { display: inline; padding: 2px 7px; margin: 0 1px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: filter 0.15s; border: 1px solid transparent; }
.phone-highlight:hover { filter: brightness(1.2); }
.phone-highlight.highlighted-find { outline: 3px solid #ffe04f; outline-offset: 2px; animation: findPulse 0.6s ease 3; }
@keyframes findPulse { 0%,100%{box-shadow:0 0 0 0 #ffe04f88} 50%{box-shadow:0 0 0 8px #ffe04f00} }

/* ─── RESULTS ───────────────────────────────────── */
.results-wrap {
  padding: 0.75rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}
.phone-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem 0.75rem 1.1rem; position: relative; transition: border-color 0.15s; }
.phone-card::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; background: var(--card-color); border-radius: 4px; }
.phone-number { color: var(--card-color); cursor: pointer; font-weight: 700; font-size: 0.88rem; }
.operator-tag { font-size: 0.57rem; padding: 2px 9px; border-radius: 999px; background: var(--op-bg); color: var(--op-color); border: 1px solid var(--op-border); font-weight: 600; }
.status-tag { font-size: 0.58rem; padding: 2px 8px; border-radius: 30px; font-weight: 600; }
.status-selector { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.status-btn { background: transparent; border: 1px solid; color: inherit; border-radius: 20px; cursor: pointer; font-family: monospace; font-size: 0.62rem; padding: 2px 8px; font-weight: 600; transition: all 0.1s; display: flex; align-items: center; gap: 3px; }
.status-btn:hover { opacity: 0.8; }
.status-btn.active { background: rgba(255,255,255,0.08); box-shadow: 0 0 0 1px currentColor inset; }
.status-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.find-btn { font-size: 0.62rem; padding: 3px 10px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); border-radius: 16px; cursor: pointer; font-family: monospace; font-weight: 600; transition: 0.1s; }
.find-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 0.78rem; line-height: 1.8; }

/* ─── STATS ─────────────────────────────────────── */
.stats-bar { padding: 0.6rem 1.4rem; background: var(--bg2); border-top: 1px solid var(--border); font-size: 0.72rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; flex-shrink: 0; color: var(--text2); }
.bottom-stats { padding: 0.9rem 1.4rem; background: var(--bg2); border-top: 1px solid var(--border); font-size: 0.75rem; display: flex; flex-wrap: wrap; gap: 24px; flex-shrink: 0; }
.stat-bar { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 3px; }
.bar-container { flex: 1; height: 5px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
.bar { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
.operator-stats-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
.operator-brick { background: var(--bg3); border-radius: 32px; padding: 3px 12px; display: flex; align-items: center; gap: 7px; font-size: 0.7rem; border-left: 3px solid; }

/* ─── MODAL ─────────────────────────────────────── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; padding: 1.5rem; min-width: 280px; }
.modal h3 { color: var(--accent); font-family: 'Unbounded', sans-serif; font-size: 0.82rem; margin-bottom: 1rem; }
.modal input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 8px 12px; font-family: monospace; font-size: 0.85rem; outline: none; }
.modal input:focus { border-color: var(--accent); }
.modal-btns { display: flex; gap: 10px; margin-top: 1rem; }
.modal-btns button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-family: monospace; font-size: 0.78rem; font-weight: 700; transition: 0.15s; }
.btn-confirm { background: var(--accent); color: var(--bg); }
.btn-cancel { background: var(--bg3); color: var(--text2); border-color: var(--border2) !important; }

/* ─── TOAST ─────────────────────────────────────── */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg3); border: 1px solid var(--accent); color: var(--accent); padding: 9px 16px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(8px); transition: all 0.25s ease; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

button { cursor: pointer; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
</style>
</head>
<body>

<!-- ══ TIMER BAR ══════════════════════════════════ -->
<div id="timerBar">
  <div id="timerDisplay">00:00</div>
  <div id="timerInputWrap">
    <input type="number" id="timerMinInput" value="5" min="0" max="99" placeholder="MM">
    <span class="timer-sep">:</span>
    <input type="number" id="timerSecInput" value="0" min="0" max="59" placeholder="SS">
  </div>
  <button class="timer-btn" id="btnTimerStart" onclick="timerStart()">▶ Старт</button>
  <button class="timer-btn" onclick="timerPause()" id="btnTimerPause" style="display:none">⏸ Пауза</button>
  <button class="timer-btn" onclick="timerResume()" id="btnTimerResume" style="display:none">▶ Продолжить</button>
  <button class="timer-btn" onclick="timerReset()">↺ Сброс</button>
  <div class="timer-progress-wrap"><div id="timerProgress" style="width:100%"></div></div>
  <div class="theme-switcher">
    <span style="font-size:0.62rem;color:var(--text3);">Тема:</span>
    <div class="theme-dot active" data-theme="dark" onclick="setTheme('dark')" title="Тёмная"></div>
    <div class="theme-dot" data-theme="light" onclick="setTheme('light')" title="Светлая"></div>
    <div class="theme-dot" data-theme="neutral" onclick="setTheme('neutral')" title="Нейтральная"></div>
    <div class="theme-dot" data-theme="purple" onclick="setTheme('purple')" title="Пурпур"></div>
    <div class="theme-dot" data-theme="ocean" onclick="setTheme('ocean')" title="Океан"></div>
    <div class="theme-dot" data-theme="red" onclick="setTheme('red')" title="Красный"></div>
    <div class="theme-dot" data-theme="amber" onclick="setTheme('amber')" title="Янтарь"></div>
    <div class="theme-dot" data-theme="rose" onclick="setTheme('rose')" title="Розовый"></div>
    <div class="theme-dot" data-theme="matrix" onclick="setTheme('matrix')" title="Матрица"></div>
    <div class="theme-dot" data-theme="slate" onclick="setTheme('slate')" title="Синий"></div>
    <div class="theme-dot" data-theme="copper" onclick="setTheme('copper')" title="Медь"></div>
  </div>
</div>

<!-- ══ HEADER ════════════════════════════════════ -->
<header>
  <div class="logo">SKL-Блокнот <span style="font-weight:400;font-size:0.8rem;opacity:0.6">· Детектор номеров</span></div>
  <div class="badge">v2.0</div>
  <button onclick="exportData()" style="margin-left:auto; background:var(--bg3); border:1px solid var(--border2); color:var(--text2); border-radius:8px; padding:5px 13px; font-size:0.68rem; font-family:monospace;">💾 Экспорт</button>
</header>

<!-- ══ FORMAT TOOLBAR ════════════════════════════ -->
<div id="formatBar">
  <button class="fmt-btn" onclick="fmt('bold')" title="Жирный (Ctrl+B)"><b>B</b></button>
  <button class="fmt-btn" onclick="fmt('italic')" title="Курсив (Ctrl+I)"><i>I</i></button>
  <button class="fmt-btn" onclick="fmt('underline')" title="Подчёркнутый (Ctrl+U)"><u>U</u></button>
  <button class="fmt-btn" onclick="fmt('strikeThrough')" title="Зачёркнутый"><s>S</s></button>
  <div class="fmt-sep"></div>

// ══════════════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════════════
var timerInterval = null;
var timerRemaining = 0;
var timerTotal = 0;
var timerRunning = false;

function timerStart() {
  var m = parseInt(document.getElementById('timerMinInput').value) || 0;
  var s = parseInt(document.getElementById('timerSecInput').value) || 0;
  timerTotal = m * 60 + s;
  timerRemaining = timerTotal;
  if (timerTotal <= 0) { showToast('⚠ Выставьте время'); return; }
  timerRunning = true;
  document.getElementById('btnTimerStart').style.display = 'none';
  document.getElementById('btnTimerPause').style.display = '';
  document.getElementById('btnTimerResume').style.display = 'none';
  clearInterval(timerInterval);
  timerTick();
  timerInterval = setInterval(timerTick, 1000);
}
function timerPause() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('btnTimerPause').style.display = 'none';
  document.getElementById('btnTimerResume').style.display = '';
}
function timerResume() {
  timerRunning = true;
  document.getElementById('btnTimerPause').style.display = '';
  document.getElementById('btnTimerResume').style.display = 'none';
  timerInterval = setInterval(timerTick, 1000);
}
function timerReset() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerRemaining = 0;
  timerTotal = 0;
  document.getElementById('timerDisplay').textContent = '00:00';
  document.getElementById('timerDisplay').classList.remove('danger');
  document.getElementById('timerProgress').style.width = '100%';
  document.getElementById('timerProgress').style.background = 'var(--accent)';
  document.getElementById('btnTimerStart').style.display = '';
  document.getElementById('btnTimerPause').style.display = 'none';
  document.getElementById('btnTimerResume').style.display = 'none';
}
function timerTick() {
  if (timerRemaining <= 0) {
    clearInterval(timerInterval);
    document.getElementById('timerDisplay').textContent = '00:00';
    document.getElementById('timerDisplay').classList.add('danger');
    showToast('⏰ Время вышло!');
    document.getElementById('btnTimerPause').style.display = 'none';
    document.getElementById('btnTimerStart').style.display = '';
    return;
  }
  var m = Math.floor(timerRemaining / 60);
  var s = timerRemaining % 60;
  document.getElementById('timerDisplay').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  var pct = timerTotal > 0 ? (timerRemaining / timerTotal) * 100 : 100;
  document.getElementById('timerProgress').style.width = pct + '%';
  var danger = timerRemaining <= 10;
  document.getElementById('timerDisplay').classList.toggle('danger', danger);
  document.getElementById('timerProgress').style.background = danger ? '#ff4444' : 'var(--accent)';
  timerRemaining--;
}

var currentFontSize = 14;
function updateFontSizeUI(sz) {
  currentFontSize = sz;
  document.getElementById('fontSizeDisplay').textContent = sz;
  var sel = document.getElementById('fontSizeSelect');
  var opts = sel.options;
  var best = 0;
  for (var i=0; i<opts.length; i++) if (parseInt(opts[i].value) <= sz) best = i;
  sel.selectedIndex = best;
}
function setFontSizePx(sz) {
  sz = Math.max(8, Math.min(72, sz));
  document.getElementById('editable').focus();
  document.execCommand('fontSize', false, '7');
  var spans = document.getElementById('editable').querySelectorAll('font[size="7"]');
  spans.forEach(function(s){ s.removeAttribute('size'); s.style.fontSize = sz + 'px'; });
  updateFontSizeUI(sz);
}
function changeFontSize(delta) {
  var steps = [8,9,10,11,12,13,14,16,18,20,22,24,28,32,36,42,48,56,64,72];
  var idx = steps.indexOf(currentFontSize);
  if (idx === -1) { idx = steps.reduce(function(bi,v,i){ return Math.abs(v-currentFontSize)<Math.abs(steps[bi]-currentFontSize)?i:bi; }, 0); }
  idx = Math.max(0, Math.min(steps.length-1, idx + delta));
  setFontSizePx(steps[idx]);
}

// ══════════════════════════════════════════════════
// FIX Enter inside phone-highlight span
// ══════════════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  var editor = document.getElementById('editable');

  // Убеждаемся что фокус в редакторе
  if (!editor.contains(document.activeElement) && document.activeElement !== editor) return;

  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;

  // Проверяем, находится ли курсор внутри phone-highlight span
  var node = sel.anchorNode;
  var span = null;
  var cur = (node && node.nodeType === 3) ? node.parentElement : node;
  while (cur && cur !== editor) {
    if (cur.classList && cur.classList.contains('phone-highlight')) { span = cur; break; }
    cur = cur.parentElement;
  }
  if (!span) return; // не в span — Enter работает штатно

  e.preventDefault();

  // Запоминаем скролл редактора и страницы
  var editorScroll = editor.scrollTop;
  var pageScroll = window.scrollY;

  // Вставляем перенос строки
  var range = sel.getRangeAt(0);
  range.deleteContents();

  // Создаём перенос после span
  var br = document.createElement('br');
  var after = span.nextSibling;
  if (after) {
    span.parentNode.insertBefore(br, after);
  } else {
    span.parentNode.appendChild(br);
    // Добавляем второй br если span последний элемент (иначе курсор не встанет)
    var br2 = document.createElement('br');
    span.parentNode.appendChild(br2);
  }

  // Ставим курсор после br
  var newRange = document.createRange();
  newRange.setStartAfter(br);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);

  // Восстанавливаем скролл
  editor.scrollTop = editorScroll;
  window.scrollTo(0, pageScroll);

  clearTimeout(window._edDebounce);
  window._edDebounce = setTimeout(parseAndUpdate, 120);
});

function normalizePhone(str) {
  var d = str.replace(/\D/g,'');
  if (d.length===11 && (d[0]==='7'||d[0]==='8')) return '7'+d.slice(1);
  if (d.length===10) return '7'+d;
  return null;
}
function formatPhone(norm) {
  if (!norm||norm.length!==11) return norm;
  return '+7 ('+norm.slice(1,4)+') '+norm.slice(4,7)+'-'+norm.slice(7,9)+'-'+norm.slice(9);
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}
function getPhoneRegex() { return /(?:\+7|8|7)[\s\-(]?\d{3}[\s\-)]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}/g; }

    tab.innerHTML =
      '<input class="tab-label" value="'+escHtml(nb.name)+'" spellcheck="false" id="label_'+nb.id+'" readonly>' +
      (cnt > 0 ? '<span class="tab-count">'+cnt+'</span>' : '') +
      (notebooks.length > 1 ? '<button class="tab-close" title="Закрыть">×</button>' : '');
    (function(nbId, tabEl, isAct) {
      tabEl.addEventListener('click', function(e) {
        if (e.target.classList.contains('tab-close')) { deleteNotebook(nbId); return; }
        if (e.target.classList.contains('tab-label') && isAct) return;
        switchToNotebook(nbId);
      });
      var lbl = tabEl.querySelector('.tab-label');
      if (isAct) {
        lbl.removeAttribute('readonly');
        lbl.addEventListener('click', function(e){ e.stopPropagation(); });
        lbl.addEventListener('blur', function(){ renameNotebookInline(nbId, lbl.value); });
        lbl.addEventListener('keydown', function(e){ if(e.key==='Enter'){e.preventDefault();lbl.blur();} });
      }
    })(nb.id, tab, isActive);
    scroll.appendChild(tab);
  }
  var activeTab = scroll.querySelector('.tab.active');
  if (activeTab) activeTab.scrollIntoView({block:'nearest', inline:'nearest'});
}

function countPhones(text) {
  var r = getPhoneRegex(); var u = new Set(); var m;
  while((m=r.exec(text))!==null){var n=normalizePhone(m[0]);if(n)u.add(n);}
  return u.size;
}
function renameNotebookInline(id, val) {
  val = (val||'').trim();
  var nb = notebooks.find(function(n){return n.id===id;});
  if (nb && val) { nb.name = val; saveState(); renderTabs(); }
}
function createNewNotebook() {
  var nb = createNotebook('Блокнот '+(notebooks.length+1));
  activeNotebookId = nb.id;
  saveState(); renderTabs(); loadNotebookIntoEditor(nb);
  showToast('✅ Создан: '+nb.name);
  setTimeout(function(){
    var last = document.getElementById('tabsScroll').lastElementChild;
    if(last) last.scrollIntoView({inline:'end'});
  },50);
}
function switchToNotebook(id) {
  saveCurrentEditorText();
  activeNotebookId = id; saveState();
  var nb = notebooks.find(function(n){return n.id===id;});
  if (nb) loadNotebookIntoEditor(nb);
  renderTabs();
}
function deleteNotebook(id) {
  if (notebooks.length<=1) {showToast('❌ Нельзя удалить последний блокнот'); return;}
  if (!confirm('Удалить блокнот?')) return;
  var idx = notebooks.findIndex(function(n){return n.id===id;});
  notebooks.splice(idx,1);
  if (activeNotebookId===id) activeNotebookId = notebooks[Math.max(0,idx-1)].id;
  saveState(); renderTabs();
  loadNotebookIntoEditor(getActiveNotebook());
  showToast('🗑 Удалено');
}
function saveCurrentEditorText() {
  var nb = getActiveNotebook();
  if (nb) nb.text = document.getElementById('editable').innerText;
}
function loadNotebookIntoEditor(nb) {
  var editor = document.getElementById('editable');
  editor.innerText = nb.text || '';
  document.getElementById('notebookName').textContent = nb.name;
  parseAndUpdate();
}

// ══════════════════════════════════════════════════
// RENAME MODAL
// ══════════════════════════════════════════════════
function closeModal() { document.getElementById('renameModal').classList.remove('open'); renameTargetId=null; }
function confirmRename() {
  var val = document.getElementById('renameInput').value.trim();
  if (val && renameTargetId) {
    var nb = notebooks.find(function(n){return n.id===renameTargetId;});
    if (nb){ nb.name=val; saveState(); renderTabs(); }
  }
  closeModal();
}
document.getElementById('renameModal').addEventListener('click', function(e){
  if (e.target===document.getElementById('renameModal')) closeModal();
});

// ══════════════════════════════════════════════════
// EDITOR HIGHLIGHTING
// ══════════════════════════════════════════════════
var isHighlighting = false;

function highlightPhonesInEditor() {
  var editor = document.getElementById('editable');
  if (isHighlighting) return;
  isHighlighting = true;

  // Сохраняем позицию скролла редактора
  var savedScrollTop = editor.scrollTop;

  var sel = window.getSelection();
  var savedAnchor = null, savedOffset = 0;
  if (sel && sel.rangeCount > 0) {
    var range = sel.getRangeAt(0);
    savedAnchor = range.startContainer;
    savedOffset = range.startOffset;
  }

  var phoneRegex = getPhoneRegex();

  var walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null, false);
  var textNodes = [];
  var node;
  while ((node = walker.nextNode())) {
    if (!node.parentElement.classList.contains('phone-highlight')) {
      textNodes.push(node);
    }
  }

  for (var i = 0; i < textNodes.length; i++) {
    var tn = textNodes[i];
    var txt = tn.nodeValue;
    phoneRegex.lastIndex = 0;
    if (!phoneRegex.test(txt)) continue;
    phoneRegex.lastIndex = 0;

    var frag = document.createDocumentFragment();
    var lastIdx = 0;
    var m;
    while ((m = phoneRegex.exec(txt)) !== null) {
      var norm = normalizePhone(m[0]);
      if (!norm) continue;
      if (m.index > lastIdx) {
        frag.appendChild(document.createTextNode(txt.slice(lastIdx, m.index)));
      }
      var op = getOperatorInfo(norm);
      var span = document.createElement('span');
      span.className = 'phone-highlight';
      span.style.cssText = 'background:'+op[2]+';color:'+op[1]+';border-color:'+op[3]+';';
      span.dataset.norm = norm;
      span.textContent = m[0];
      span.addEventListener('click', (function(n){ return function(){ scrollToCard(n); }; })(norm));
      frag.appendChild(span);
      lastIdx = m.index + m[0].length;
    }
    if (lastIdx < txt.length) frag.appendChild(document.createTextNode(txt.slice(lastIdx)));
    if (tn.parentNode) tn.parentNode.replaceChild(frag, tn);
  }

  // Восстанавливаем курсор
  try {
    if (savedAnchor && document.body.contains(savedAnchor)) {
      var newRange = document.createRange();
      var maxOff = savedAnchor.nodeType === 3 ? savedAnchor.nodeValue.length : savedAnchor.childNodes.length;
      newRange.setStart(savedAnchor, Math.min(savedOffset, maxOff));
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
    }
  } catch(e) {}

  // Восстанавливаем скролл редактора — предотвращает прыжок
  editor.scrollTop = savedScrollTop;

  isHighlighting = false;
}

function scrollToCard(norm) {
  var card = document.querySelector('[data-card-norm="'+norm+'"]');
  if (card) {
    card.scrollIntoView({behavior:'smooth', block:'center'});
    card.style.outline = '2px solid var(--accent)';
    setTimeout(function(){ card.style.outline=''; }, 1500);
  }
  var nb = getActiveNotebook();
  var op = getOperatorInfo(norm);
  var st = (nb.statuses && nb.statuses[norm]) || 'ne_zvonili';
  var stObj = STATUS_LIST.find(function(s){return s.key===st;}) || STATUS_LIST[0];
  showToast('📞 '+formatPhone(norm)+' · '+op[0]+' · '+stObj.label);
}

window.findInEditorText = function(norm) {
  var editor = document.getElementById('editable');
  editor.querySelectorAll('.phone-highlight.highlighted-find').forEach(function(el){
    el.classList.remove('highlighted-find');
  });
  var target = editor.querySelector('.phone-highlight[data-norm="'+norm+'"]');
  if (target) {
    target.scrollIntoView({behavior:'smooth', block:'center'});
    target.classList.add('highlighted-find');
    setTimeout(function(){ target.classList.remove('highlighted-find'); }, 2500);
    showToast('🔍 Найден: '+formatPhone(norm));
  } else {
    showToast('❌ Не найден в тексте');
  }
};

// ══════════════════════════════════════════════════
// STATUS
// ══════════════════════════════════════════════════
window.setPhoneStatus = function(norm, statusKey) {
  var nb = getActiveNotebook();
  if (!nb.statuses) nb.statuses = {};
  nb.statuses[norm] = statusKey;
  saveState();
  var resultsEl = document.getElementById('results');
  var savedScroll = resultsEl ? resultsEl.scrollTop : 0;
  var pageScroll = window.scrollY;
  renderResultsPanel(currentPhonesList);
  renderBottomStats(currentPhonesList);
  renderTabs();
  if (resultsEl) resultsEl.scrollTop = savedScroll;
  window.scrollTo(0, pageScroll);
};

// ══════════════════════════════════════════════════
// RESULTS PANEL
// ══════════════════════════════════════════════════
function renderResultsPanel(phones) {
  var container = document.getElementById('results');
  document.getElementById('resultCount').textContent = phones.length;
  if (!phones.length) {
    container.innerHTML = '<div class="empty-state">📡 Вставьте текст с номерами<br>в блокнот слева</div>';
    return;
  }
  var nb = getActiveNotebook();
  var html = '';
  for (var i=0; i<phones.length; i++) {
    var ph = phones[i];
    var norm = ph.norm;
    var op = getOperatorInfo(norm);
    var currentSt = (nb.statuses && nb.statuses[norm]) || 'ne_zvonili';
    var stObj = STATUS_LIST.find(function(s){return s.key===currentSt;}) || STATUS_LIST[0];
    var stBtns = '';
    for (var j=0; j<STATUS_LIST.length; j++) {
      var st = STATUS_LIST[j];
      var isAct = st.key === currentSt;
      stBtns += '<button class="status-btn'+(isAct?' active':'')+'" style="color:'+st.color+';border-color:'+st.color+'40;" onclick="setPhoneStatus(\''+norm+'\',\''+st.key+'\')">' +
        '<span class="status-dot" style="background:'+st.color+'"></span>'+st.label+'</button>';
    }
    html += '<div class="phone-card" data-card-norm="'+norm+'" style="--card-color:'+op[1]+';--op-bg:'+op[2]+';--op-color:'+op[1]+';--op-border:'+op[3]+'">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
        '<span class="phone-number">📞 '+formatPhone(norm)+'</span>' +
        '<span class="operator-tag">'+op[0]+'</span>' +
        '<span class="status-tag" style="background:'+stObj.color+'22;color:'+stObj.color+';border:1px solid '+stObj.color+'44;">'+stObj.label+'</span>' +
        '<button class="find-btn" onclick="findInEditorText(\''+norm+'\')" style="margin-left:auto;">🔍 Найти</button>' +
      '</div>' +
      '<div class="status-selector">'+stBtns+'</div>' +
    '</div>';
  }
  container.innerHTML = html;
}

// ══════════════════════════════════════════════════
// BOTTOM STATS
// ══════════════════════════════════════════════════
function renderBottomStats(phones) {
  var container = document.getElementById('bottomStats');
  if (!phones.length) { container.innerHTML=''; return; }
  var nb = getActiveNotebook();
  var opMap = {};
  var stCount = {};
  STATUS_LIST.forEach(function(s){ stCount[s.key]=0; });
  for (var i=0; i<phones.length; i++) {
    var opName = getOperatorInfo(phones[i].norm)[0];
    opMap[opName] = (opMap[opName]||0)+1;
    var st = (nb.statuses && nb.statuses[phones[i].norm]) || 'ne_zvonili';
    if (stCount.hasOwnProperty(st)) stCount[st]++;
  }
  var total = phones.length;
  var opHtml = '<div style="flex:1;min-width:200px;"><strong style="font-size:0.75rem;">📊 Операторы</strong><div class="operator-stats-grid">';
  for (var op in opMap) {
    var pct = total ? Math.round((opMap[op]/total)*100) : 0;
    opHtml += '<div class="operator-brick" style="border-left-color:'+getOpColorByName(op)+'"><span>'+op+'</span><strong>'+opMap[op]+'</strong><span style="color:var(--text3)">'+pct+'%</span></div>';
  }
  opHtml += '</div></div>';
  var stHtml = '<div style="flex:2;min-width:260px;"><strong style="font-size:0.75rem;">🏷 Статусы</strong><div style="margin-top:8px;">';
  for (var k=0; k<STATUS_LIST.length; k++) {
    var s = STATUS_LIST[k];
    var cnt = stCount[s.key];
    var p = total ? (cnt/total)*100 : 0;
    stHtml += '<div class="stat-bar"><span style="width:148px;color:'+s.color+';font-weight:600;font-size:0.68rem;">'+s.label+'</span>' +
      '<div class="bar-container"><div class="bar" style="width:'+p+'%;background:'+s.color+'"></div></div>' +
      '<span style="width:28px;text-align:right;font-weight:700;">'+cnt+'</span>' +
      '<span style="width:36px;text-align:right;font-size:0.62rem;color:var(--text2);">'+Math.round(p)+'%</span></div>';
  }
  stHtml += '</div></div>';
  container.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:24px;width:100%;">'+opHtml+stHtml+'</div>';
}

// ══════════════════════════════════════════════════
// PARSE & UPDATE
// ══════════════════════════════════════════════════
function parseAndUpdate() {
  var editor = document.getElementById('editable');
  var rawText = editor.innerText;
  document.getElementById('charCount').textContent = rawText.length;

  var r = getPhoneRegex();
  var uniqueMap = {};
  var order = [];
  var m;
  while ((m = r.exec(rawText)) !== null) {
    var norm = normalizePhone(m[0]);
    if (norm && !uniqueMap.hasOwnProperty(norm)) { uniqueMap[norm]=m[0]; order.push(norm); }
  }

  var phones = order.map(function(n){ return {norm:n, rawStr:uniqueMap[n]}; });
  currentPhonesList = phones;
  document.getElementById('foundCount').textContent = phones.length;

  var nb = getActiveNotebook();
  if (!nb.statuses) nb.statuses = {};
  for (var i=0; i<phones.length; i++) {
    if (!nb.statuses.hasOwnProperty(phones[i].norm)) nb.statuses[phones[i].norm] = 'ne_zvonili';
  }
  for (var norm in nb.statuses) {
    if (!phones.some(function(p){return p.norm===norm;})) delete nb.statuses[norm];
  }
  nb.text = rawText;
  saveState();

  highlightPhonesInEditor();
  renderResultsPanel(phones);
  renderBottomStats(phones);
  renderTabs();
}

// ══════════════════════════════════════════════════
// EXPORT
// ══════════════════════════════════════════════════
window.exportData = function() {
  var nb = getActiveNotebook();
  var lines = ['=== '+nb.name+' ===',''];
  var r = getPhoneRegex(); var found = {}; var order = []; var m;
  while((m=r.exec(nb.text||''))!==null){var n=normalizePhone(m[0]);if(n&&!found[n]){found[n]=m[0];order.push(n);}}
  for (var i=0; i<order.length; i++) {
    var norm = order[i];
    var op = getOperatorInfo(norm);
    var stKey = (nb.statuses && nb.statuses[norm]) || 'ne_zvonili';
    var stObj = STATUS_LIST.find(function(s){return s.key===stKey;});
    lines.push(formatPhone(norm)+'\t'+op[0]+'\t'+(stObj?stObj.label:'?'));
  }
  var blob = new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nb.name.replace(/[^а-яёa-z0-9]/gi,'_')+'_'+Date.now()+'.txt';
  a.click();
  showToast('💾 Экспорт готов!');
};

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
var debounceTimer;
function onEditorInput() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(parseAndUpdate, 120);
}

window.onload = function() {
  var saved = loadState();
  if (saved && saved.notebooks && saved.notebooks.length > 0) {
    notebooks = saved.notebooks;
    activeNotebookId = saved.activeNotebookId;
    if (!notebooks.find(function(n){return n.id===activeNotebookId;})) activeNotebookId = notebooks[0].id;
  } else {
    var nb = createNotebook('Блокнот 1');
    nb.text = '+7 (916) 123-45-67\n8-905-777-88-99\n+79261234567\n89501234567';
    activeNotebookId = nb.id;
    saveState();
  }
  renderTabs();
  var nb = getActiveNotebook();
  var editor = document.getElementById('editable');
  editor.innerText = nb.text || '';
  document.getElementById('notebookName').textContent = nb.name;

  editor.addEventListener('input', onEditorInput);
  editor.addEventListener('paste', function(e) {
    e.preventDefault();
    var text = (e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  window.addEventListener('beforeunload', saveCurrentEditorText);
  parseAndUpdate();
};

// ══════════════════════════════════════════════════
// RESIZER — drag to resize notebook vs results (horizontal only)
// ══════════════════════════════════════════════════
(function() {
  var layout = document.getElementById('mainLayout');
  var resizer = document.getElementById('resizer');
  if (!resizer || !layout) return;

  var dragging = false;

  function getPct() {
    var stored = parseFloat(localStorage.getItem('skl_split'));
    return (stored > 15 && stored < 85) ? stored : 50;
  }
  function setPct(pct) {
    pct = Math.max(15, Math.min(85, pct));
    layout.style.setProperty('--split', pct + '%');
    resizer.style.left = pct + '%';
    localStorage.setItem('skl_split', pct);
  }

  setPct(getPct());

  resizer.addEventListener('mousedown', function(e) {
    e.preventDefault();
    dragging = true;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var layoutRect = layout.getBoundingClientRect();
    var pct = ((e.clientX - layoutRect.left) / layoutRect.width) * 100;
    setPct(pct);
  });

  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  resizer.addEventListener('touchstart', function(e) {
    dragging = true;
    resizer.classList.add('dragging');
  }, {passive: true});
  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    var layoutRect = layout.getBoundingClientRect();
    var pct = ((e.touches[0].clientX - layoutRect.left) / layoutRect.width) * 100;
    setPct(pct);
  }, {passive: true});
  document.addEventListener('touchend', function() {
    dragging = false;
    resizer.classList.remove('dragging');
  });
})();
</script>
